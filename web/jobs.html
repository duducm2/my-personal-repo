<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job openings — Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-jobs">
    <div class="page">
      <header class="hero">
        <div class="hero-top">
          <div>
            <p class="eyebrow">
              <span class="section-title-en">Pipeline · bento board</span>
            </p>
            <h1 class="brand">
              <span class="section-title-en">Job openings</span>
            </h1>
          </div>
          <div class="hero-actions">
            <button type="button" id="open-portals-btn" class="nav-btn">
              <span class="section-title-en">Job portals</span>
              <kbd>Shift+J</kbd>
            </button>
            <button type="button" id="open-profile-btn" class="nav-btn">
              <span class="section-title-en">Profile</span>
              <kbd>Shift+P</kbd>
            </button>
            <button type="button" id="open-companies-btn" class="nav-btn">
              <span class="section-title-en">Companies</span>
              <kbd>Shift+C</kbd>
            </button>
            <span
              id="save-status"
              class="save-status"
              aria-live="polite"
            ></span>
            <button type="button" id="save-btn" class="save-btn" disabled>
              Save
            </button>
          </div>
        </div>
        <p class="subtitle">
          <span class="section-title-en"
            >Track live openings. Click a tile to edit the dossier. UI stays
            English. <kbd>Shift+J</kbd> portals · <kbd>Shift+P</kbd> profile ·
            <kbd>Shift+C</kbd> companies · <kbd>Alt+S</kbd> search ·
            <kbd>Ctrl+Enter</kbd> save · <kbd>Esc</kbd> close search / modal /
            home.</span
          >
        </p>
      </header>

      <div id="search-bar" class="cockpit-search-bar" aria-hidden="true">
        <input
          id="job-search-input"
          class="cockpit-search-input"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Company, role, skills gap, notes, URL…"
          title="Search (Alt+S)"
        />
      </div>

      <main>
        <section
          class="section company-search-section"
          aria-label="Job openings"
        >
          <div class="company-search-sticky">
            <div class="company-toolbar">
              <button type="button" id="job-add-btn" class="add-btn">
                + Add
              </button>
            </div>

            <div
              id="jobs-filters"
              class="company-filters"
              role="group"
              aria-label="Job filters"
            ></div>

            <p id="job-result-count" class="company-result-count"></p>
          </div>

          <div id="jobs-results" class="company-bento"></div>
        </section>

        <section class="section" aria-labelledby="job-links-heading">
          <div class="section-head">
            <h2 id="job-links-heading" class="section-title">
              <span class="section-title-en"
                >Watch pages &amp; communities</span
              >
            </h2>
          </div>
          <div id="job-links-root" class="job-links-grid"></div>
        </section>
      </main>
    </div>

    <dialog
      id="job-modal"
      class="company-modal"
      aria-labelledby="job-modal-title"
    >
      <div class="company-modal-inner">
        <header class="company-modal-head">
          <h2 id="job-modal-title" class="company-modal-title"></h2>
          <button
            type="button"
            id="job-modal-close"
            class="company-modal-close"
            aria-label="Close"
          >
            ✕
          </button>
        </header>
        <div id="job-modal-body" class="company-modal-body"></div>
      </div>
    </dialog>

    <script src="jobs-app.js"></script>
  </body>
</html>
