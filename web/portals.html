<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job portals</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-portals">
    <div class="page">
      <header class="hero">
        <div class="hero-top">
          <div>
            <h1 class="brand">
              <span class="section-title-en">Job portals</span>
            </h1>
          </div>
          <div class="hero-actions">
            <button type="button" id="open-openings-btn" class="nav-btn">
              <span class="section-title-en">Openings</span>
            </button>
            <button type="button" id="open-companies-btn" class="nav-btn">
              <span class="section-title-en">Companies</span>
            </button>
            <button type="button" id="open-profile-btn" class="nav-btn">
              <span class="section-title-en">Profile</span>
            </button>
            <button type="button" id="open-advice-btn" class="nav-btn">
              <span class="section-title-en">Advice</span>
            </button>
            <button type="button" id="open-help-btn" class="nav-btn">
              <span class="section-title-en">Help</span>
            </button>
            <span
              id="save-status"
              class="save-status"
              aria-live="polite"
            ></span>
          </div>
        </div>
      </header>

      <div id="search-bar" class="cockpit-search-bar" aria-hidden="true">
        <input
          id="portal-search-input"
          class="cockpit-search-input"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Portal, ATS, notes…"
        />
      </div>

      <main>
        <section
          class="section company-search-section"
          aria-label="Job portals"
        >
          <div class="company-search-sticky">
            <div class="company-toolbar">
              <button type="button" id="portal-add-btn" class="add-btn">
                + Add
              </button>
            </div>

            <div
              id="portals-filters"
              class="company-filters"
              role="group"
              aria-label="Portal filters"
            ></div>

            <p id="portal-result-count" class="company-result-count"></p>
          </div>

          <div id="portals-results" class="company-bento"></div>
        </section>
      </main>
    </div>

    <dialog
      id="portal-modal"
      class="company-modal"
      aria-labelledby="portal-modal-title"
    >
      <div class="company-modal-inner">
        <header class="company-modal-head">
          <h2 id="portal-modal-title" class="company-modal-title"></h2>
          <button
            type="button"
            id="portal-modal-close"
            class="company-modal-close"
            aria-label="Close"
          >
            ✕
          </button>
        </header>
        <div id="portal-modal-body" class="company-modal-body"></div>
      </div>
    </dialog>

    <script src="flags.js"></script>
    <script src="card-nav.js"></script>
    <script src="portals-app.js"></script>
  </body>
</html>
